<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rana nel labirinto</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#05070f;color:#e8ecff;font-family:system-ui,sans-serif;touch-action:manipulation}
  body{display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px;min-height:100vh}
  h1{font-size:18px;margin:4px 0;letter-spacing:2px}
  canvas{width:100%;max-width:456px;height:auto;background:#070b1a;border:2px solid #2a3d7a;border-radius:8px;display:block;touch-action:none}
  #pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center}
  #pad button{font-size:20px;border-radius:10px;border:1px solid #2a3d7a;background:#101a3a;color:#e8ecff;user-select:none;-webkit-user-select:none;touch-action:none}
  #up{grid-column:2;grid-row:1}
  #left{grid-column:1;grid-row:2}
  #down{grid-column:2;grid-row:2}
  #right{grid-column:3;grid-row:2}
  p{font-size:12px;opacity:.7;margin:0;text-align:center;max-width:456px}
</style>
</head>
<body>
<h1>RANA NEL LABIRINTO</h1>
<canvas id="c"></canvas>
<div id="pad">
  <button id="up">▲</button>
  <button id="left">◀</button>
  <button id="down">▼</button>
  <button id="right">▶</button>
</div>
<p>Frecce o WASD per muoverti, oppure scorri col dito sul gioco. Raccogli tutti i semi, evita le coccinelle e mangia i semi grandi per renderle vulnerabili.</p>
<script>
(function(){
  const cv=document.getElementById('c'),ctx=cv.getContext('2d');
  const T=24,COLS=19,ROWS_N=21,OY=40,W=COLS*T,H=ROWS_N*T+OY;
  cv.width=W;cv.height=H;
  const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
  const HALF=['##########','#........#','#.###.##.#','#o###.##.#','#.........','#.###.#.##','#.....#...','#####.###.','#####.#   ','#####.# ##','#.....    '];
  const BUG_COLORS=['#ef4444','#f97316','#d946ef','#fb7185'];
  const HOME=[9,10],EXIT=[9,6];

  function buildRows(){
    const rows=[];
    for(let r=0;r<=10;r++){const l=HALF[r];rows.push(l+l.slice(0,9).split('').reverse().join(''));}
    for(let r=11;r<ROWS_N;r++)rows.push(rows[20-r]);
    return rows;
  }
  let grid=[],seedsLeft=0;
  function freshGrid(){
    grid=buildRows().map(r=>r.split(''));
    grid[16][9]=' ';
    seedsLeft=0;
    grid.forEach(row=>row.forEach(ch=>{if(ch==='.'||ch==='o')seedsLeft++;}));
  }
  const wall=(c,r)=>r<0||r>=ROWS_N||c<0||c>=COLS||grid[r][c]==='#';
  freshGrid();
  function field(tx,ty){
    const d=Array.from({length:ROWS_N},()=>Array(COLS).fill(1e9));
    d[ty][tx]=0;const q=[[tx,ty]];
    for(let i=0;i<q.length;i++){
      const [x,y]=q[i];
      for(const [dx,dy] of DIRS){
        const nx=x+dx,ny=y+dy;
        if(!wall(nx,ny)&&d[ny][nx]>d[y][x]+1){d[ny][nx]=d[y][x]+1;q.push([nx,ny]);}
      }
    }
    return d;
  }
  const fieldHome=field(HOME[0],HOME[1]);
  const fieldExit=field(EXIT[0],EXIT[1]);

  let S,frog,bugs=[],time=0;
  function loadBest(){try{return +localStorage.getItem('rana_best')||0;}catch(e){return 0;}}
  function saveBest(v){try{localStorage.setItem('rana_best',String(v));}catch(e){}}

  function resetActors(){
    frog={x:9,y:16,dx:0,dy:0,want:null,face:[0,-1]};
    const starts=[[9,8],[8,10],[9,10],[10,10]];
    const delays=[0.4,2.0,3.6,5.2];
    bugs=starts.map((p,i)=>({x:p[0],y:p[1],dx:0,dy:0,mode:'wait',scared:false,delay:Math.max(0.3,delays[i]-0.3*(S.level-1)),color:BUG_COLORS[i],id:i}));
    S.clock=0;S.scaredT=0;
  }
  function newGame(){
    S={score:0,lives:3,level:1,state:'ready',freeze:0,timer:0,overT:0,best:loadBest(),clock:0,scaredT:0};
    freshGrid();resetActors();
  }
  function nextLevel(){
    S.level++;freshGrid();resetActors();S.freeze=1.2;S.state='play';
  }

  function move(e,dist,chooser){
    let guard=0;
    while(dist>1e-9&&guard++<8){
      const cx=Math.round(e.x),cy=Math.round(e.y);
      if(Math.abs(e.x-cx)<1e-7&&Math.abs(e.y-cy)<1e-7){
        e.x=cx;e.y=cy;chooser(e,cx,cy);
        if((!e.dx&&!e.dy)||wall(cx+e.dx,cy+e.dy)){e.dx=0;e.dy=0;return;}
      }
      if(!e.dx&&!e.dy)return;
      let cur,next;
      if(e.dx){cur=e.x;next=e.dx>0?Math.floor(cur+1e-7)+1:Math.ceil(cur-1e-7)-1;}
      else{cur=e.y;next=e.dy>0?Math.floor(cur+1e-7)+1:Math.ceil(cur-1e-7)-1;}
      const d=Math.abs(next-cur),m=Math.min(dist,d);
      if(e.dx)e.x=(m>=d-1e-9)?next:e.x+e.dx*m;
      else e.y=(m>=d-1e-9)?next:e.y+e.dy*m;
      dist-=m;
    }
  }
  function frogChoose(e,cx,cy){
    if(e.want&&!wall(cx+e.want[0],cy+e.want[1])){e.dx=e.want[0];e.dy=e.want[1];e.face=[e.dx,e.dy];}
  }
  function bugChoose(b,cx,cy){
    if(b.mode==='eaten'&&cx===HOME[0]&&cy===HOME[1]){b.mode='leave';b.scared=false;}
    if(b.mode==='leave'&&cx===EXIT[0]&&cy===EXIT[1]){b.mode='chase';}
    const open=DIRS.filter(d=>!wall(cx+d[0],cy+d[1]));
    let pick;
    if(b.mode==='eaten'||b.mode==='leave'){
      const f=b.mode==='eaten'?fieldHome:fieldExit;
      let best=1e9;
      for(const d of open){const v=f[cy+d[1]][cx+d[0]];if(v<best){best=v;pick=d;}}
    }else{
      let opts=open.filter(d=>!(d[0]===-b.dx&&d[1]===-b.dy));
      if(!opts.length)opts=open;
      if(b.scared||Math.random()<0.12){
        pick=opts[Math.floor(Math.random()*opts.length)];
      }else{
        let tx=Math.round(frog.x),ty=Math.round(frog.y);
        if(b.id===1){tx+=frog.face[0]*4;ty+=frog.face[1]*4;}
        if(b.id===3&&Math.hypot(tx-cx,ty-cy)<6){tx=1;ty=19;}
        let best=1e9;
        for(const d of opts){const v=Math.hypot(tx-(cx+d[0]),ty-(cy+d[1]));if(v<best){best=v;pick=d;}}
      }
    }
    b.dx=pick[0];b.dy=pick[1];
  }
  function setWant(w){
    if(!frog)return;
    frog.want=w;
    if((frog.dx||frog.dy)&&frog.dx===-w[0]&&frog.dy===-w[1]){frog.dx=w[0];frog.dy=w[1];frog.face=w;}
  }
  function startIfNeeded(){
    if(S.state==='ready')S.state='play';
    else if(S.state==='over'&&S.overT>0.8){const b=S.best;newGame();S.best=b;S.state='play';}
  }

  function loseLife(){
    S.state='dying';S.timer=1.0;
  }
  function update(dt){
    time+=dt;
    if(S.state==='over'){S.overT+=dt;return;}
    if(S.state==='ready')return;
    if(S.state==='dying'){
      S.timer-=dt;
      if(S.timer<=0){
        S.lives--;
        if(S.lives<=0){S.state='over';S.overT=0;if(S.score>S.best){S.best=S.score;saveBest(S.best);}}
        else{resetActors();S.freeze=1.2;S.state='play';}
      }
      return;
    }
    if(S.state==='clear'){
      S.timer-=dt;
      if(S.timer<=0)nextLevel();
      return;
    }
    if(S.freeze>0){S.freeze-=dt;return;}
    S.clock+=dt;
    // rana
    move(frog,4.2*dt,frogChoose);
    const tx=Math.round(frog.x),ty=Math.round(frog.y);
    if(Math.hypot(frog.x-tx,frog.y-ty)<0.35){
      const ch=grid[ty][tx];
      if(ch==='.'){grid[ty][tx]=' ';S.score+=10;seedsLeft--;}
      else if(ch==='o'){
        grid[ty][tx]=' ';S.score+=50;seedsLeft--;
        S.scaredT=Math.max(2.5,7-0.8*(S.level-1));
        bugs.forEach(b=>{if(b.mode==='chase'||b.mode==='leave')b.scared=true;});
      }
      if(S.score>S.best){S.best=S.score;}
    }
    if(S.scaredT>0){
      S.scaredT-=dt;
      if(S.scaredT<=0)bugs.forEach(b=>{b.scared=false;});
    }
    // coccinelle
    const base=Math.min(5.2,3.4+0.25*(S.level-1));
    for(const b of bugs){
      if(b.mode==='wait'){if(S.clock>=b.delay)b.mode='leave';else continue;}
      const sp=b.mode==='eaten'?8:(b.scared?2.4:base);
      move(b,sp*dt,bugChoose);
    }
    // collisioni
    for(const b of bugs){
      if(b.mode==='wait'||b.mode==='eaten')continue;
      if(Math.hypot(b.x-frog.x,b.y-frog.y)<0.7){
        if(b.scared){b.mode='eaten';b.scared=false;S.score+=200;}
        else{loseLife();return;}
      }
    }
    if(seedsLeft<=0){S.state='clear';S.timer=1.5;if(S.score>S.best)S.best=S.score;saveBest(S.best);}
  }

  // disegno
  const px=v=>v*T+T/2,py=v=>v*T+T/2+OY;
  function drawWalls(){
    for(let r=0;r<ROWS_N;r++)for(let c=0;c<COLS;c++){
      if(grid[r][c]!=='#')continue;
      const x=c*T,y=r*T+OY;
      ctx.fillStyle='#14214d';ctx.fillRect(x,y,T,T);
      ctx.strokeStyle='#5b8cff';ctx.lineWidth=2;ctx.beginPath();
      if(!wall(c,r-1)){ctx.moveTo(x,y+1);ctx.lineTo(x+T,y+1);}
      if(!wall(c,r+1)){ctx.moveTo(x,y+T-1);ctx.lineTo(x+T,y+T-1);}
      if(!wall(c-1,r)){ctx.moveTo(x+1,y);ctx.lineTo(x+1,y+T);}
      if(!wall(c+1,r)){ctx.moveTo(x+T-1,y);ctx.lineTo(x+T-1,y+T);}
      ctx.stroke();
    }
  }
  function drawSeeds(){
    for(let r=0;r<ROWS_N;r++)for(let c=0;c<COLS;c++){
      const ch=grid[r][c];
      if(ch==='.'){ctx.fillStyle='#e2d3a8';ctx.beginPath();ctx.arc(px(c),py(r),2.6,0,7);ctx.fill();}
      else if(ch==='o'){
        ctx.fillStyle='#86efac';ctx.beginPath();ctx.arc(px(c),py(r),5.5+Math.sin(time*6)*1.2,0,7);ctx.fill();
      }
    }
  }
  function drawFrog(scale){
    const ang=Math.atan2(frog.face[1],frog.face[0])+Math.PI/2;
    ctx.save();ctx.translate(px(frog.x),py(frog.y));ctx.rotate(ang);ctx.scale(scale,scale);
    const k=Math.sin(time*14)*((frog.dx||frog.dy)?2:0);
    ctx.fillStyle='#22c55e';
    ctx.beginPath();ctx.ellipse(-9,6+k,3.5,5,0.4,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(9,6-k,3.5,5,-0.4,0,7);ctx.fill();
    ctx.fillStyle='#4ade80';ctx.beginPath();ctx.ellipse(0,1,9,10,0,0,7);ctx.fill();
    ctx.fillStyle='#bbf7d0';ctx.beginPath();ctx.ellipse(0,5,5,4.5,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-5,-6,3.8,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(5,-6,3.8,0,7);ctx.fill();
    ctx.fillStyle='#052e16';
    ctx.beginPath();ctx.arc(-5,-7,1.8,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(5,-7,1.8,0,7);ctx.fill();
    ctx.restore();
  }
  function drawBug(b){
    const cx=px(b.x),cy=py(b.y);
    if(b.mode==='eaten'){
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(cx-4,cy,3,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(cx+4,cy,3,0,7);ctx.fill();
      ctx.fillStyle='#111';
      ctx.beginPath();ctx.arc(cx-4,cy,1.3,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(cx+4,cy,1.3,0,7);ctx.fill();
      return;
    }
    const dir=(b.dx||b.dy)?[b.dx,b.dy]:[0,-1];
    const ang=Math.atan2(dir[1],dir[0])+Math.PI/2;
    let shell=b.color;
    if(b.scared){shell=(S.scaredT<2&&Math.floor(time*6)%2)?'#f8fafc':'#60a5fa';}
    ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.arc(0,-8,4.2,0,7);ctx.fill();
    ctx.strokeStyle='#111';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-2,-11);ctx.lineTo(-5,-14);ctx.moveTo(2,-11);ctx.lineTo(5,-14);ctx.stroke();
    ctx.fillStyle=shell;ctx.beginPath();ctx.ellipse(0,2,9.5,10,0,0,7);ctx.fill();
    ctx.strokeStyle='#111';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(0,12);ctx.stroke();
    ctx.fillStyle='#111';
    [[-5,0],[5,0],[-4,6],[4,6]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],1.9,0,7);ctx.fill();});
    ctx.restore();
  }
  function banner(lines,color){
    ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,H/2-70,W,140);
    ctx.textAlign='center';
    ctx.fillStyle=color||'#fff';ctx.font='bold 26px system-ui,sans-serif';ctx.fillText(lines[0],W/2,H/2-18);
    ctx.fillStyle='#cbd5ff';ctx.font='15px system-ui,sans-serif';
    for(let i=1;i<lines.length;i++)ctx.fillText(lines[i],W/2,H/2+10+(i-1)*24);
  }
  function draw(){
    ctx.fillStyle='#070b1a';ctx.fillRect(0,0,W,H);
    ctx.font='bold 15px system-ui,sans-serif';ctx.fillStyle='#e8ecff';
    ctx.textAlign='left';ctx.fillText('Punti '+S.score,10,24);
    ctx.textAlign='center';ctx.fillText('Livello '+S.level,W/2,24);
    ctx.textAlign='right';ctx.fillText('Vite '+'♥'.repeat(Math.max(0,S.lives)),W-10,24);
    ctx.textAlign='center';ctx.font='12px system-ui,sans-serif';ctx.fillStyle='#9aa4d6';
    ctx.fillText('Record '+S.best,W/2,38);
    drawWalls();drawSeeds();
    bugs.forEach(drawBug);
    if(S.state==='dying'){drawFrog(Math.max(0.05,S.timer));}
    else drawFrog(1);
    if(S.state==='ready')banner(['RANA NEL LABIRINTO','Tocca o premi un tasto per iniziare','Raccogli tutti i semi, evita le coccinelle'],'#4ade80');
    else if(S.state==='over')banner(['GAME OVER','Punti: '+S.score+' · Livello: '+S.level,'Tocca o premi un tasto per riprovare'],'#f87171');
    else if(S.state==='clear')banner(['LIVELLO COMPLETATO!','Preparati al livello '+(S.level+1)],'#fde047');
    else if(S.freeze>0&&S.state==='play'){ctx.fillStyle='#fde047';ctx.font='bold 20px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('Pronto!',W/2,py(12)+6);}
  }

  let last=performance.now();
  function loop(now){
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    update(dt);draw();
    requestAnimationFrame(loop);
  }

  // input
  const KEYMAP={ArrowRight:[1,0],KeyD:[1,0],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowDown:[0,1],KeyS:[0,1],ArrowUp:[0,-1],KeyW:[0,-1]};
  addEventListener('keydown',e=>{
    const w=KEYMAP[e.code];
    if(w){e.preventDefault();startIfNeeded();setWant(w);}
    else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();startIfNeeded();}
  });
  [['up',[0,-1]],['down',[0,1]],['left',[-1,0]],['right',[1,0]]].forEach(p=>{
    document.getElementById(p[0]).addEventListener('pointerdown',e=>{e.preventDefault();startIfNeeded();setWant(p[1]);});
  });
  let sx=0,sy=0,sw=false;
  cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;sw=true;startIfNeeded();});
  cv.addEventListener('pointermove',e=>{
    if(!sw)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))>22){
      setWant(Math.abs(dx)>Math.abs(dy)?[dx>0?1:-1,0]:[0,dy>0?1:-1]);
      sx=e.clientX;sy=e.clientY;
    }
  });
  const endSwipe=()=>{sw=false;};
  cv.addEventListener('pointerup',endSwipe);
  cv.addEventListener('pointercancel',endSwipe);

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
